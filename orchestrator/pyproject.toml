[project]
name = "a2a-deep-research"
version = "0.1.0"
description = "Local A2A deep-research pipeline (Google ADK + Ollama + crawl4ai MCP)"
requires-python = ">=3.11"
dependencies = [
    "google-adk[a2a]>=2.3,<3",
    "litellm>=1.0",  # ADK LiteLlm backend → talks to local Ollama
    "ollama>=0.6.1",
    "pydantic>=2.9",
    "python-dotenv>=1.2.2",
    "httpx>=0.27.0",
    "mcp>=1.28.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.9.0",
    "psutil>=6.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = ["live: runs against real Ollama model (opt-in via -m live)"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".claude", "memory-bank"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811", "F401", "F841"]
